name: Update learning time

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README learning time
        env:
          START_DATE: "2026-01-21"
          README_FILE: "README.md"
        run: |
          python - << 'PY'
          from datetime import datetime, timezone
          import os, re

          start_date = os.environ["START_DATE"]
          readme_file = os.environ["README_FILE"]

          start = datetime.strptime(start_date, "%Y-%m-%d").replace(tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)

          days = (now - start).days
          if days < 0:
            days = 0

          months = days // 30
          if months >= 1:
            month_label = "month" if months == 1 else "months"
            day_label = "day" if days == 1 else "days"
            text = f"{months} {month_label} ({days} {day_label})"
          else:
            day_label = "day" if days == 1 else "days"
            text = f"{days} {day_label}"

          with open(readme_file, "r", encoding="utf-8") as f:
            content = f.read()

          # CORRIGIDO: Substitui o texto entre as tags
          new_content = re.sub(
            r'(<strong>).*?(</strong>)',
            rf'\1{text}\2',
            content,
            flags=re.DOTALL
          )

          with open(readme_file, "w", encoding="utf-8") as f:
            f.write(new_content)

          print(f"✅ Updated learning time to: {text}")
          PY

      - name: Update 100 Days of Code badge
        env:
          CHALLENGE_START_DATE: "2026-05-06"
          README_FILE: "README.md"
        run: |
          python - << 'PY'
          from datetime import datetime, timezone
          import os, re

          start_date = os.environ["CHALLENGE_START_DATE"]
          readme_file = os.environ["README_FILE"]

          start = datetime.strptime(start_date, "%Y-%m-%d").replace(tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)
          day = (now - start).days + 1

          if day < 1:
            day = 1
          if day > 100:
            day = 100

          with open(readme_file, "r", encoding="utf-8") as f:
            content = f.read()

          # CORRIGIDO: Usa re.sub simples com função
          def replace_day(match):
            return f"Day {day}/100"

          new_content = re.sub(
            r'Day \d{1,3}/\d{1,3}',
            replace_day,
            content
          )

          with open(readme_file, "w", encoding="utf-8") as f:
            f.write(new_content)

          print(f"✅ Updated 100 Days challenge to day {day}/100")
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update learning time and challenge day [skip ci]"
          git push
