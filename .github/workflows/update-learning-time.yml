name: Update 100 Days of Code

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update 100 Days of Code badge
        env:
          CHALLENGE_START_DATE: "2026-05-06"
          README_FILE: "README.md"
        run: |
          python - << 'PY'
          from datetime import datetime, timezone
          import os, re

          start_date = os.environ["CHALLENGE_START_DATE"]
          readme_file = os.environ["README_FILE"]

          start = datetime.strptime(start_date, "%Y-%m-%d").replace(tzinfo=timezone.utc)
          now = datetime.now(timezone.utc)
          day = (now - start).days + 1

          if day < 1:
            day = 1
          if day > 100:
            day = 100

          with open(readme_file, "r", encoding="utf-8") as f:
            content = f.read()

          # Atualiza o texto "Dia X consecutivo"
          new_content = re.sub(
            r'C# · Dia \d+ consecutivo',
            f'C# · Dia {day} consecutivo',
            content
          )

          # Atualiza QUALQUER badge de 100 days (funciona com github OU csharp)
          new_content = re.sub(
            r'100%20Days%20of%20Code-Day%\d+%2F100[^\s"]*',
            f'100%20Days%20of%20Code-Day%20{day}%2F100-brightgreen?style=for-the-badge&logo=csharp&logoColor=white',
            new_content
          )

          with open(readme_file, "w", encoding="utf-8") as f:
            f.write(new_content)

          print(f"✅ Updated to Day {day}/100")
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update 100 days badge [skip ci]"
          git push
